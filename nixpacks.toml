# Build the Vite frontend during deploy so the backend can serve it.
[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = ["pip install -r requirements.txt", "cd web && npm ci"]

[phases.build]
cmds = ["cd web && npm run build"]

[start]
cmd = "uvicorn app:app --host 0.0.0.0 --port $PORT"
